name: Speelhal - Supabase actief houden en back-up

on:
  schedule:
    - cron: '17 5 */3 * *'   # elke 3 dagen om 05:17 UTC
  workflow_dispatch:          # handmatig starten via het tabblad Actions

permissions:
  contents: write

concurrency:
  group: kamertje-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Database uitlezen (houdt Supabase actief)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_KEY:-}" ]; then
            echo "::error::De secrets SUPABASE_URL en/of SUPABASE_KEY ontbreken (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          base="${SUPABASE_URL%/}/rest/v1"
          get() {
            curl -sS --fail-with-body --retry 3 --retry-delay 10 --retry-all-errors \
              -H "apikey: ${SUPABASE_KEY}" "${base}/$1"
          }

          # Haalt een hele tabel op (in pagina's van 1000) en schrijft hem naar $2.
          export_table() {
            echo '[]' > /tmp/all.json
            offset=0
            while :; do
              get "$1&limit=1000&offset=${offset}" > /tmp/page.json
              jq -s '.[0] + .[1]' /tmp/all.json /tmp/page.json > /tmp/merged.json
              mv /tmp/merged.json /tmp/all.json
              [ "$(jq 'length' /tmp/page.json)" -lt 1000 ] && break
              offset=$((offset + 1000))
            done
            jq '.' /tmp/all.json > "$2"
          }

          mkdir -p /tmp/backup
          export_table "players?select=name,created_at&order=name.asc" /tmp/backup/kamertje-players.json
          export_table "games?select=*&order=played_at.asc,id.asc" /tmp/backup/kamertje-games.json
          export_table "matches?select=*&order=played_at.asc,id.asc" /tmp/backup/speelhal-matches.json
          export_table "multi_results?select=*&order=played_at.asc,id.asc" /tmp/backup/speelhal-multi-results.json

          # Pas overschrijven als alles gelukt is
          mkdir -p backup
          cp /tmp/backup/*.json backup/
          for f in backup/*.json; do echo "$f: $(jq 'length' "$f") regels"; done

      - name: Back-up opslaan in de repo
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backup/
          if ! git diff --cached --quiet; then
            git commit -m "Back-up Speelhal $(date -u +%Y-%m-%d)"
          else
            # GitHub schakelt geplande workflows uit na 60 dagen zonder activiteit in de repo.
            last=$(git log -1 --format=%ct)
            if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
              git commit --allow-empty -m "Keepalive: geplande back-up actief houden"
            else
              echo "Geen wijzigingen sinds de vorige back-up."
              exit 0
            fi
          fi
          git push
